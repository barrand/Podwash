<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PodWash Golden Retriever — Typed policy audit</title>
  <link rel="stylesheet" href="/typed-audit.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">PodWash evaluation</p>
      <h1>Typed-policy audit</h1>
      <p class="lede">Three assistant first passes, layered over the current human-approved goldens. This view is read-only: it cannot alter a golden.</p>
      <p class="legend"><span class="baseline">Current golden</span><span class="jev-legend">Jev v6 detected</span><span class="paid_ad">Paid ad</span><span class="cross_show_promo">Other-show promo</span><span class="publisher_promo">Publisher promo</span><span class="membership_appeal">Membership</span><span class="signoff">Sign-off</span><span class="network_id">Network ID</span><span class="underwriting">Underwriting</span></p>
    </header>
    <section id="episodes" class="episodes" aria-label="Prepared typed-policy audits"></section>
    <article id="audit" class="audit hidden">
      <div class="audit-header">
        <button id="back" type="button">← All audits</button>
        <div><p id="show" class="eyebrow"></p><h2 id="title"></h2></div>
      </div>
      <p id="summary" class="summary"></p>
      <section id="findings" class="findings"></section>
      <section id="transcript" class="transcript" aria-label="Complete episode transcript"></section>
    </article>
  </main>
  <script src="/typed-audit.js"></script>
</body>
</html>
